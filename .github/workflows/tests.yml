name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Python 3.9 is end-of-life and setup-python has no build for the current Ubuntu runner image.
          # 3.9 is still covered on Windows and macOS.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests (standard library only)
        run: python -m unittest discover -s tests -t . -v
      - name: Demo is reproducible
        shell: bash
        run: |
          python tools/run_demo.py > /dev/null
          git diff --exit-code -- examples/expected_outputs
      - name: Build and verify Skill package
        run: python -m examdna.cli package --out dist

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest coverage
      - run: coverage run --source=examdna -m pytest -q
      - run: coverage report
